<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gymkhana ERP Suite - DLBR OS SYS Edition</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Estilos Customizados e Animações -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
    @keyframes floatSlow {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, -30px) rotate(10deg); }
    }
    
    .anim-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .anim-slide-up { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .anim-scale-in { animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-glow-pulse { animation: pulseGlow 6s ease-in-out infinite; }
    .anim-float-slow { animation: floatSlow 15s ease-in-out infinite; }
    
    /* Microinterações */
    .hover-bounce { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease; }
    .hover-bounce:hover { transform: scale(1.05); }
    .hover-bounce:active { transform: scale(0.95); }
    
    .hover-lift { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease; }
    .hover-lift:hover { transform: translateY(-8px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); border-color: rgba(225,29,72,0.4); }

    /* Scrollbar minimalista */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
    
    /* Estilo do Papel Térmico para NFC-e */
    .thermal-paper {
        background-color: #f9f9f9;
        color: #1a1a1a;
        font-family: 'Courier New', Courier, monospace;
        position: relative;
    }
    .thermal-paper::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        right: 0;
        height: 6px;
        background-size: 12px 12px;
        background-image: radial-gradient(circle at 6px 0, transparent 6px, #f9f9f9 7px);
        background-repeat: repeat-x;
    }
  
/* ===== RESPONSIVIDADE GLOBAL ===== */
html,body{
  max-width:100%;
  overflow-x:hidden !important;
}

img,video,canvas,svg{
  max-width:100%;
  height:auto;
}

@media (max-width:1024px){
  .hover-lift:hover,
  .hover-bounce:hover{
    transform:none !important;
  }
}

@media (max-width:768px){
  header{
    padding-left:12px !important;
    padding-right:12px !important;
  }

  .text-5xl{font-size:2rem !important;}
  .text-4xl{font-size:1.75rem !important;}

  [class*="rounded-\[3rem\]"]{
    border-radius:1.5rem !important;
  }

  nav{
    width:95vw !important;
  }
}

@media (max-width:640px){
  .fixed,
  .absolute{
    max-width:100vw;
  }

  input,select,button{
    min-height:44px;
  }
}

</style>
</head>
<body class="bg-[#050505] text-zinc-50 antialiased overflow-x-hidden selection:bg-rose-500/30">

  <!-- Background Orbs Globais Ultra Animados -->
  <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] bg-rose-600 rounded-full mix-blend-screen filter blur-[150px] opacity-10 anim-float-slow pointer-events-none z-0"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] bg-violet-600 rounded-full mix-blend-screen filter blur-[150px] opacity-10 anim-float-slow pointer-events-none z-0" style="animation-delay: 5s;"></div>

  <!-- Sistema de Toasts -->
  <div id="toast-container" class="fixed top-24 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- ======================= -->
  <!-- TELA 01: LOGIN          -->
  <!-- ======================= -->
  <div id="view-login" class="min-h-screen w-full flex items-center justify-center relative overflow-hidden z-10 hidden">
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIvPgo8cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDcpIi8+Cjwvc3ZnPg==')] opacity-50 z-0"></div>
    <div class="absolute top-1/4 left-1/4 w-[40vw] h-[40vw] bg-rose-600 rounded-full mix-blend-screen filter blur-[150px] opacity-20 anim-glow-pulse z-0"></div>
    
    <div class="bg-[#0a0a0a]/60 backdrop-blur-3xl p-12 rounded-[3rem] shadow-[0_30px_80px_rgba(0,0,0,0.8)] border border-white/10 w-full max-w-md relative z-10 anim-slide-up">
      <div class="mb-8 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-[1.5rem] bg-gradient-to-tr from-rose-600 to-rose-400 text-white mb-6 shadow-[0_0_40px_rgba(225,29,72,0.5)] border border-rose-400/50 anim-scale-in">
          <i data-lucide="flame" class="w-10 h-10"></i>
        </div>
        <h1 class="text-3xl font-black text-zinc-100 tracking-widest uppercase">Gymkhana</h1>
        <p class="text-rose-400 text-sm mt-2 font-semibold tracking-wide">DLBR OS SYS Enterprise Edition</p>
      </div>
      
      <form id="form-login" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2 uppercase tracking-wider">Usuário</label>
          <div class="relative group">
            <i data-lucide="at-sign" class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500 transition-colors group-focus-within:text-rose-500"></i>
            <input type="text" id="login-user" class="w-full pl-14 pr-5 py-4 bg-white/5 rounded-2xl border border-white/10 focus:border-rose-500/50 focus:bg-white/10 focus:shadow-[0_0_20px_rgba(225,29,72,0.15)] outline-none transition-all text-base text-zinc-100 placeholder:text-zinc-600 font-medium" placeholder="Ex: admin" required />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2 uppercase tracking-wider">Senha</label>
          <div class="relative group">
            <i data-lucide="key-round" class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500 transition-colors group-focus-within:text-rose-500"></i>
            <input type="password" id="login-pass" class="w-full pl-14 pr-5 py-4 bg-white/5 rounded-2xl border border-white/10 focus:border-rose-500/50 focus:bg-white/10 focus:shadow-[0_0_20px_rgba(225,29,72,0.15)] outline-none transition-all text-base text-zinc-100 placeholder:text-zinc-600 font-medium" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 px-6 rounded-2xl shadow-[0_10px_30px_rgba(225,29,72,0.3)] mt-6 text-lg flex items-center justify-center gap-3 uppercase tracking-wider hover-bounce">
          Autenticar <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>
      <div class="text-center mt-6">
        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Pressione <kbd class="bg-white/10 px-2 py-1 rounded text-zinc-300">F12</kbd> para Licença de Uso</p>
      </div>
    </div>
  </div>

  <!-- ======================= -->
  <!-- APLICAÇÃO PRINCIPAL     -->
  <!-- ======================= -->
  <div id="view-app" class="flex-1 w-full min-h-screen relative z-10 hidden">
    <!-- Header Animado -->
    <header class="fixed top-0 left-0 right-0 h-24 border-b border-white/10 bg-black/40 backdrop-blur-3xl flex items-center justify-between px-8 z-40 shadow-[0_4px_30px_rgba(0,0,0,0.5)] anim-slide-up" style="animation-duration: 0.8s;">
      <div class="flex items-center gap-5">
         <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-rose-400 flex items-center justify-center text-white shadow-[0_0_30px_rgba(225,29,72,0.4)] border border-rose-400/30 hover-bounce cursor-pointer">
            <i data-lucide="flame" stroke-width="2.5"></i>
         </div>
         <div>
           <h1 class="text-xl font-bold tracking-widest text-zinc-50 leading-tight drop-shadow-md">GYMKHANA</h1>
           <h2 id="header-title" class="text-xs font-semibold text-rose-400 uppercase tracking-widest leading-tight mt-0.5">Visão Geral</h2>
         </div>
      </div>
      
      <div class="flex items-center gap-5">
         <div class="hidden md:flex items-center gap-3 text-zinc-300 text-sm bg-white/5 px-5 py-2.5 rounded-full border border-white/10 backdrop-blur-xl shadow-inner hover-bounce cursor-default">
           <i data-lucide="clock" class="w-4 h-4 text-rose-400"></i> <span id="current-date"></span>
         </div>
         <button class="relative p-3 text-zinc-400 transition-all rounded-full bg-white/5 border border-white/10 backdrop-blur-xl hover-bounce">
           <i data-lucide="bell" class="w-5 h-5"></i>
           <span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_10px_rgba(225,29,72,1)] animate-pulse"></span>
         </button>
         <div class="w-px h-8 bg-white/10 mx-2 hidden sm:block"></div>
         <div class="flex items-center gap-3 bg-white/5 p-1.5 pr-5 rounded-full border border-white/10 backdrop-blur-xl cursor-pointer group shadow-lg transition-all hover:bg-white/10 hover:border-rose-500/30 hover-bounce" onclick="openProfileMenu()">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 font-bold text-base group-hover:border-rose-500/50 group-hover:text-rose-400 transition-colors shadow-inner">
              A
            </div>
            <div class="flex-1 min-w-0 hidden lg:block">
              <p id="user-name" class="text-sm font-semibold text-zinc-200 group-hover:text-white transition-colors">Admin</p>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500 group-hover:text-rose-400 ml-2 transition-colors"></i>
         </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full h-full pt-32 pb-40 overflow-y-auto custom-scrollbar relative z-0">
      <div class="px-6 md:px-10 h-full max-w-[1500px] mx-auto" id="main-content">
        <!-- Renderizado dinamicamente -->
      </div>
    </main>

    <!-- Bottom Dock Navigation flutuante com animação de entrada -->
    <nav class="fixed bottom-4 md:bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1.5 px-3 py-3 bg-black/60 backdrop-blur-3xl border border-white/10 rounded-[2rem] shadow-[0_30px_60px_rgba(0,0,0,0.8)] anim-slide-up max-w-[95vw] overflow-x-auto hide-scrollbar" style="animation-delay: 0.2s">
      <div id="nav-dashboard" class="relative group hover-bounce shrink-0" onclick="switchView('dashboard')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="layout-grid"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Visão Geral</div>
      </div>

      <div id="nav-pdv" class="relative group hover-bounce" onclick="switchView('pdv')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="shopping-cart"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Terminal (PDV)</div>
      </div>

      <div id="nav-totem" class="relative group hover-bounce" onclick="switchView('totem')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="monitor"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Autoatendimento</div>
      </div>

      <div id="nav-kds" class="relative group hover-bounce" onclick="switchView('kds')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="chef-hat"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Cozinha (KDS)</div>
      </div>

      <div class="w-px h-10 bg-white/10 mx-2"></div>

      <div id="nav-estoque" class="relative group hover-bounce" onclick="switchView('estoque')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="package-open"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Estoque</div>
      </div>
      
      <div id="nav-rh" class="relative group hover-bounce" onclick="switchView('rh')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="users"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Cadastros / Pessoas</div>
      </div>

      <div id="nav-financeiro" class="relative group hover-bounce" onclick="switchView('financeiro')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="dollar-sign"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Financeiro</div>
      </div>

      <div class="w-px h-10 bg-white/10 mx-2"></div>

      <div id="nav-fiscal" class="relative group hover-bounce" onclick="switchView('fiscal')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="file-text"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Fiscal / SPED</div>
      </div>

      <div id="nav-admin" class="relative group hover-bounce" onclick="switchView('admin')">
        <button class="nav-btn relative flex items-center justify-center w-[3.5rem] h-[3.5rem] rounded-2xl transition-all duration-300 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 border border-transparent">
          <i data-lucide="settings"></i><span class="nav-indicator absolute -bottom-2 w-6 h-1 rounded-full bg-rose-500 transition-all duration-300 opacity-0 scale-0"></span>
        </button>
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 text-zinc-100 text-sm font-semibold rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-2xl">Painel Proprietário</div>
      </div>

    </nav>
  </div>

  <!-- ======================= -->
  <!-- TELA TOTEM FULLSCREEN   -->
  <!-- ======================= -->
  <div id="view-totem-full" class="fixed inset-0 bg-[#050505] z-[100] flex flex-col font-sans select-none anim-fade-in relative overflow-hidden hidden">
    <div class="absolute top-[-10%] right-[-5%] w-[60vw] h-[60vw] bg-rose-600 rounded-full mix-blend-screen filter blur-[200px] opacity-10 pointer-events-none anim-float-slow z-0"></div>
    
    <header class="bg-black/40 backdrop-blur-3xl border-b border-white/10 text-zinc-100 p-6 md:p-8 flex flex-col md:flex-row justify-between items-center z-10 shadow-[0_10px_30px_rgba(0,0,0,0.5)] gap-4 md:gap-0">
      <div class="flex items-center gap-4 md:gap-6">
        <div class="bg-gradient-to-tr from-rose-600 to-rose-400 p-3 md:p-4 rounded-[1.5rem] text-white shadow-[0_0_30px_rgba(225,29,72,0.5)] border border-rose-400/50 hover-bounce"><i data-lucide="flame" class="w-7 h-7 md:w-9 md:h-9"></i></div>
        <div>
          <h1 class="text-2xl md:text-4xl font-black tracking-widest text-white drop-shadow-md">GYMKHANA</h1>
          <p class="text-rose-400 text-xs md:text-sm font-bold uppercase tracking-[0.3em] mt-1 drop-shadow-sm text-center md:text-left">Autoatendimento</p>
        </div>
      </div>
      <button onclick="promptPassword(() => { closeTotemMode(); }, ['Proprietário', 'Gerente'], 'Sair do Autoatendimento')" class="px-6 py-3 md:px-8 md:py-4 bg-white/5 hover:bg-red-500/20 hover:text-red-400 rounded-2xl text-sm md:text-lg font-bold transition-all flex items-center gap-3 text-zinc-300 border border-white/10 backdrop-blur-md hover:shadow-[0_0_20px_rgba(239,68,68,0.2)] hover-bounce">
         <i data-lucide="shield-alert" class="w-5 h-5 md:w-6 md:h-6"></i> Sair do Modo Cliente
      </button>
    </header>

    <div class="flex-1 overflow-hidden flex flex-col relative z-10" id="totem-content-area">
      <!-- Steps rendered here via JS -->
    </div>
  </div>

  <!-- ======================= -->
  <!-- MODALS CONTAINER        -->
  <!-- ======================= -->
  <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-2xl z-[999] flex items-center justify-center p-4 hidden">
    <div class="bg-[#0a0a0a]/90 backdrop-blur-3xl rounded-[2.5rem] shadow-[0_0_100px_rgba(225,29,72,0.2)] border border-white/10 w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh] anim-scale-in">
      <div class="px-8 py-6 flex justify-between items-center border-b border-white/5 bg-white/5">
        <h3 id="modal-title" class="text-xl font-bold text-zinc-100 tracking-wide">Título</h3>
        <button onclick="closeModal()" class="p-2.5 rounded-full text-zinc-400 hover:bg-rose-500/20 hover:text-rose-400 transition-all border border-transparent hover:border-rose-500/30 hover-bounce">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="px-8 py-8 overflow-y-auto custom-scrollbar flex-1 relative" id="modal-body">
         <!-- Content injected via JS -->
      </div>

    function addToast(message, type = 'success') {
      const container = document.getElementById('toast-container');

      }`;

      iconWrap.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-triangle' : type === 'info' ? 'info' : 'check'}"></i>`;
      
      const text = document.createElement('span');
      text.innerText = message;
      
      toast.appendChild(iconWrap);
      toast.appendChild(text);
      container.appendChild(toast);
      lucide.createIcons({ root: toast });

    function confirmUniversalPassword() {
      const pass = document.getElementById('auth-universal-pass').value;
      const validAdmin = employees.find(e => e.password === pass && pendingPasswordRoles.includes(e.cargo));

    // --- REGRAS DE NEGÓCIO: VENDAS, ESTORNO E FLUXO DE CAIXA ---
    function getSaldoCaixaDinheiro() {
        const today = new Date().toLocaleDateString('pt-BR');
        let saldo = 0;
        transactions.filter(t => t.data === today).forEach(t => {
            if (t.tipo === 'RECEITA' && (t.metodo === 'Dinheiro' || t.descricao.includes('Aporte'))) {
                saldo += t.valor;
            } else if (t.tipo === 'DESPESA' && (!t.metodo || t.metodo === 'Dinheiro')) {
                saldo += t.valor; 
            }
        });
        return saldo;
    }

    function processSale(items, total, origem, paymentMethod, discount = 0, splitPayments = null, trocoTotal = 0) {
      const id = Math.floor(Math.random() * 100000);
      const newOrder = {
        id: id, items: items, subtotal: total + discount, desconto: discount, total: total, status: 'Pendente', origem: origem,
        pagamento: paymentMethod || 'Dinheiro',
        pagamentosDetalhados: splitPayments,
        troco: trocoTotal,
        hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
        data: new Date().toLocaleDateString('pt-BR'),
        timestamp: Date.now()
      };
      
      orders.push(newOrder);
      setStore('gymkhana_orders', orders);
      
      // Registro de Transações Financeiras
      if (splitPayments && splitPayments.length > 0) {
          splitPayments.forEach(p => {
              transactions.unshift({
                  id: Date.now() + Math.random(),
                  tipo: 'RECEITA',
                  descricao: `Venda ${origem} #${id} (${p.metodo})`,
                  metodo: p.metodo,
                  valor: p.aplicado, 
                  data: new Date().toLocaleDateString('pt-BR')
              });
          });
      } else {
          transactions.unshift({
            id: id, tipo: 'RECEITA', descricao: `Venda ${origem} #${id} (${paymentMethod})`, metodo: paymentMethod, valor: total, data: new Date().toLocaleDateString('pt-BR')
          });
      }
      setStore('gymkhana_transactions', transactions);

      // Baixa de Estoque
      items.forEach(item => {
        const prod = inventory.find(p => p.id === item.id);
        if (prod) prod.estoque -= item.quantidade;
      });
      setStore('gymkhana_inventory', inventory);
      
      if (origem !== 'Totem') addToast(`Pedido #${id} pago e enviado à produção.`, 'success');
      return newOrder;
    }

      }

      let paymentRows = '';
      if (order.pagamentosDetalhados && order.pagamentosDetalhados.length > 0) {

      `).join('');

      const bars = [40, 70, 45, 90, 65, 80, Math.min(100, Math.max(10, (totalSales / 500) * 100))].map((h, i) => `

    function executeSupervisorAction(val) {
        const id = parseInt(val);
        if(isNaN(id) || id < 1 || id > 26) {
            addToast('Código de função inválido.', 'error');
            const el = document.getElementById('sup-cmd-input');
            if(el) { el.value = ''; el.focus(); }
            return;
        }

        closeModal(); // Fechar o menu supervisor

        switch(id) {
            case 1: switchView('fiscal'); break;
            case 2: 
                if(cartPDV.length > 0) openPDVPayment(); 
                else addToast('Caixa Livre. Adicione produtos primeiro.', 'error');
                break;
            case 3: addToast('Consultando SAT Fiscal... Status: OPERANTE.', 'success'); break;
            case 4: addToast('Verificando comunicação USB... Impressora Térmica conectada na COM3.', 'success'); break;
            case 5: addToast('Tabela de preços sincronizada com sucesso da Matriz.', 'success'); break;
            case 6: openPriceCheckModal(); break;
            case 7: addToast('Módulo de grade e variações não habilitado nesta licença.', 'error'); break;
            case 8: addToast('Para devoluções, utilize a tela de Histórico Fiscal (Cancelamentos).', 'info'); break;
            case 9: addToast('Para remover um item, clique na lixeira vermelha no carrinho.', 'info'); break;
            case 10: requestCancelCoupon(); break;
            case 11: addToast('Regras de "Leve X Pague Y" aplicadas ao terminal local.', 'success'); break;
            case 12: addToast('Combos promocionais sincronizados com sucesso.', 'success'); break;
            case 13: addToast('Crédito de conveniado: Acesso liberado no módulo de Pessoas.', 'success'); break;
            case 14: addToast('Arquivos de imagem e logos recarregados (Sincronia OK).', 'success'); break;
            case 15: addToast('Iniciando comunicação com balança pesadora na porta COM1... Aguardando peso.', 'info'); break;
            case 16: addToast('Módulo SiTef inicializado. Pinpad Operante.', 'success'); break;
            case 17: 
                if(cartPDV.length > 0) { openPDVPayment(); addToast('Utilize múltiplos cartões no Pagamento (Split).', 'info'); }
                else addToast('Caixa Livre.', 'error');
                break;
            case 18: openCashRegister(); break;
            case 19: addToast('Auditoria remota: Pacote de transações enviado para a Retaguarda.', 'success'); break;
            case 20: showLeituraX(); break;
            case 21: closeCashRegister(); break;
            case 22: openCashRegister(); break;

                if(cartPDV.length > 0) { openPDVPayment(); }
                else addToast('Caixa Livre.', 'error');
                break;

            case 26: switchView('rh'); addToast('Edite as permissões de Desconto na aba Equipe.', 'info'); break;
        }
    }

      pdvActivePaymentMethod = '';

      openModal("Finalizar Pagamento", html);
      renderPaymentModalBody();
    }

    function selectPDVPaymentMethod(method) {
        pdvActivePaymentMethod = method;
        renderPaymentModalBody();
    }

    function addPDVPayment() {
        const input = document.getElementById('pdv-payment-val');
        if(!input) return;
        const val = parseFloat(input.value);
        if(isNaN(val) || val <= 0) return addToast("Valor de pagamento inválido.", "error");

        const totalPagoAplicado = currentPDVPayments.reduce((acc, curr) => acc + curr.aplicado, 0);
        const falta = currentPDVTotal - totalPagoAplicado;

        let trocoGerado = 0;
        let valorAplicado = val;

        if (pdvActivePaymentMethod === 'Dinheiro') {
            if (val > falta) {
                trocoGerado = val - falta;
                const saldoCaixa = getSaldoCaixaDinheiro();
                
                if (trocoGerado > saldoCaixa) {
                    return addToast(`ATENÇÃO: Fundo de troco insuficiente na gaveta! Em caixa: R$ ${saldoCaixa.toFixed(2)}. Troco Necessário: R$ ${trocoGerado.toFixed(2)}`, "error");
                }
                valorAplicado = falta;
            }
        } else {
            if (val > falta) {
                return addToast(`O valor informado (R$ ${val.toFixed(2)}) excede o restante (R$ ${falta.toFixed(2)}). Pagamentos eletrônicos não geram troco em dinheiro.`, "error");
            }
        }

        currentPDVPayments.push({
            metodo: pdvActivePaymentMethod,
            valor: val,             
            aplicado: valorAplicado,
            troco: trocoGerado
        });

        pdvActivePaymentMethod = '';
        renderPaymentModalBody();
    }

    function removePDVPayment(index) {
        currentPDVPayments.splice(index, 1);
        renderPaymentModalBody();
    }

    function finalizePDVSale() {
        const totalPagoAplicado = currentPDVPayments.reduce((acc, curr) => acc + curr.aplicado, 0);
        if (totalPagoAplicado < currentPDVTotal) return;

        const methodsArr = currentPDVPayments.map(p => p.metodo);
        const uniqueMethods = [...new Set(methodsArr)];
        const methodString = uniqueMethods.length > 1 ? `Múltiplo (${uniqueMethods.join(', ')})` : uniqueMethods[0];
        
        const totalTroco = currentPDVPayments.reduce((acc, curr) => acc + curr.troco, 0);

        const order = processSale(cartPDV, currentPDVTotal, 'Caixa PDV', methodString, 0, currentPDVPayments, totalTroco);

        cartPDV = [];
        updatePDVCart();
        updatePDVGrid();
        showReceiptModal(order);
    }

    function requestCancelCoupon() {
        if(cartPDV.length === 0) {
            addToast('O carrinho já está vazio.', 'info');
            return;
        }
        promptPassword(() => {
            cartPDV = [];
            updatePDVCart();
            updatePDVGrid();
            addToast('Cupom fiscal cancelado com sucesso.', 'info');
        }, ['Proprietário', 'Gerente'], "Cancelamento de Cupom");
    }

    function requestSuspendSale() {
        if(cartPDV.length === 0) {
            addToast('Não há itens para suspender.', 'error');
            return;
        }
        promptPassword(() => {
            const code = Math.floor(1000 + Math.random() * 9000).toString();

                items: [...cartPDV],
                date: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})

        const html = `

                <p class="text-base text-zinc-400 font-medium">Insira o código da venda suspensa gerado anteriormente ou selecione na lista abaixo:</p>
                <div class="flex gap-4">
                    <input type="text" id="resume-code-input" class="flex-1 bg-black/40 border border-white/10 rounded-2xl px-6 py-4 text-white text-xl font-black outline-none focus:border-rose-500 shadow-inner tracking-widest" placeholder="Ex: 4021" onkeydown="if(event.key === 'Enter') confirmResumeSale(this.value)">
                    <button onclick="confirmResumeSale(document.getElementById('resume-code-input').value)" class="px-8 py-4 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-lg rounded-2xl transition-all border border-zinc-700 hover-bounce shadow-lg">Buscar</button>

                   ${rows}
                </div>
            </div>

            const el = document.getElementById('resume-code-input');
            if(el) el.focus();

    function confirmResumeSale(code) {
        if(!code) return;
        const sale = suspendedSales.find(s => s.code === code.trim());
        if(!sale) return addToast('Venda não encontrada para o código informado.', 'error');
        
        promptPassword(() => {
            cartPDV = [...sale.items];
            suspendedSales = suspendedSales.filter(s => s.code !== code.trim());
            setStore('gymkhana_suspended', suspendedSales);
            updatePDVCart();
            updatePDVGrid();
            closeModal();
            addToast(`Venda ${code} retomada com sucesso. O cupom foi reaberto.`, 'success');
        }, ['Proprietário', 'Gerente', 'Caixa'], 'Autorização para Retomar');
    }

    function unlockPDV() {
      const u = document.getElementById('pdv-op-user').value;
      const p = document.getElementById('pdv-op-pass').value;
      
      const user = employees.find(e => e.username === u && e.password === p);
      
      if(user || (u === 'admin' && p === 'admin')) {
        pdvUnlocked = true;
        pdvOperator = user ? user.nome : 'Root Admin';
        addToast(`Caixa liberado. Bom trabalho, ${pdvOperator}!`, 'success');
        renderPDV(document.getElementById('main-content'));
      } else {
        addToast('ACESSO NEGADO. Senha incorreta.', 'error');
      }
    }

    function lockPDV() {
      pdvUnlocked = false;
      pdvOperator = null;
      addToast('Caixa trancado com segurança.', 'info');
      renderPDV(document.getElementById('main-content'));
    }

    function updatePDVGrid() {
      if(!pdvUnlocked) return;
      const term = document.getElementById('pdv-search').value.toLowerCase();
      const filtered = inventory.filter(p => p.nome.toLowerCase().includes(term) || p.categoria.toLowerCase().includes(term));
      const grid = document.getElementById('pdv-grid');
      
      if(filtered.length === 0) {
         grid.innerHTML = `<div class="col-span-full py-10 text-center text-zinc-500 font-bold text-xl uppercase tracking-widest">Nenhum item encontrado.</div>`;
         return;
      }
      
      grid.innerHTML = filtered.map((p, i) => `
        <button onclick="addToPDVCart(${p.id})" ${p.estoque <= 0 ? 'disabled' : ''} class="text-left bg-black/40 p-6 rounded-[2rem] border transition-all flex flex-col h-64 backdrop-blur-md anim-slide-up ${p.estoque <= 0 ? 'border-transparent opacity-40 cursor-not-allowed grayscale' : 'border-white/10 hover:border-rose-500/50 hover:bg-white/10 hover:shadow-[0_15px_40px_rgba(225,29,72,0.3)] hover-bounce'}" style="animation-delay: ${i * 0.05}s">
          <div class="w-full flex justify-between items-start mb-6">
             <div class="w-16 h-16 flex items-center justify-center bg-white/5 rounded-2xl border border-white/10 text-rose-400 shadow-inner">
                <i data-lucide="flame" class="w-8 h-8"></i>
             </div>
             <span class="text-xs font-bold px-4 py-2 rounded-full border shadow-inner ${p.estoque > 0 ? 'bg-white/5 border-white/10 text-zinc-300' : 'bg-red-500/20 border-red-500/30 text-red-400 uppercase tracking-widest'}">
                ${p.estoque > 0 ? p.estoque + ' un' : 'Esgotado'}
             </span>
          </div>
          <h4 class="font-bold text-zinc-100 text-xl truncate w-full mb-2 tracking-wide">${p.nome}</h4>
          <p class="font-black text-rose-400 text-3xl mt-auto drop-shadow-md">R$ ${p.preco.toFixed(2)}</p>
        </button>
      `).join('');
      lucide.createIcons({ root: grid });
    }

    function addToPDVCart(id) {
      const prod = inventory.find(i => i.id === id);
      if(!prod || prod.estoque <= 0) return;
      const exist = cartPDV.find(i => i.id === id);
      if(exist) {
        if(exist.quantidade >= prod.estoque) return;
        exist.quantidade++;
      } else {
        cartPDV.push({...prod, quantidade: 1});
      }
      updatePDVCart();
    }
    
    function changePDVQty(id, delta) {
       const item = cartPDV.find(i => i.id === id);
       if(!item) return;
       
       if (delta < 0 && item.quantidade <= 1) {
          requestRemovePDVItem(id); 
       } else {
          item.quantidade += delta;
          updatePDVCart();
       }
    }

    function requestRemovePDVItem(id) {
        promptPassword(() => {
            cartPDV = cartPDV.filter(i => i.id !== id);
            updatePDVCart();
            addToast('Item removido com autorização.', 'info');
        }, ['Proprietário', 'Gerente'], "Cancelamento de Item");
    }

    function updatePDVCart() {
      if(!pdvUnlocked) return;
      const list = document.getElementById('pdv-cart-list');
      const countEl = document.getElementById('pdv-cart-count');
      const totalEl = document.getElementById('pdv-total');
      const btn = document.getElementById('btn-finish-pdv');
      const titleEl = document.getElementById('pdv-cart-title');
      const actionsEl = document.getElementById('pdv-cart-actions');
      
      const total = cartPDV.reduce((acc, curr) => acc + (curr.preco * curr.quantidade), 0);
      totalEl.innerText = `R$ ${total.toFixed(2)}`;
      
      if(cartPDV.length > 0) {
        titleEl.innerHTML = '<span class="text-rose-400 flex items-center gap-2 drop-shadow-md"><i data-lucide="file-text" class="w-6 h-6"></i> Cupom Aberto</span>';
        actionsEl.classList.remove('hidden');
        
        countEl.innerText = cartPDV.length;
        countEl.classList.remove('hidden');
        btn.disabled = false;
        
        list.innerHTML = cartPDV.map((item, i) => `
          <div class="flex flex-col p-6 bg-white/5 rounded-[2rem] border border-white/5 gap-5 shadow-inner anim-slide-up" style="animation-delay: ${i*0.05}s">
            <div class="flex justify-between items-start">
              <h5 class="font-bold text-zinc-100 text-xl pr-2 tracking-wide">${item.nome}</h5>
              <button onclick="requestRemovePDVItem(${item.id})" class="text-zinc-500 hover:text-rose-400 transition-colors bg-black/40 p-3 rounded-full hover:bg-black/60 shadow-inner hover-bounce"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            </div>
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-5 bg-black/40 rounded-2xl p-2 border border-white/5 shadow-inner">
                 <button onclick="changePDVQty(${item.id}, -1)" class="w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white transition-colors hover-bounce"><i data-lucide="minus" class="w-5 h-5"></i></button>
                 <span class="w-10 text-center font-bold text-zinc-100 text-xl">${item.quantidade}</span>
                 <button onclick="addToPDVCart(${item.id})" class="w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white transition-colors hover-bounce"><i data-lucide="plus" class="w-5 h-5"></i></button>
              </div>
              <span class="font-black text-rose-400 text-3xl drop-shadow-[0_0_10px_rgba(225,29,72,0.3)]">R$ ${(item.quantidade * item.preco).toFixed(2)}</span>
            </div>
          </div>
        `).join('');
      } else {
        titleEl.innerHTML = 'Caixa Livre';
        actionsEl.classList.add('hidden');
        
        countEl.classList.add('hidden');
        btn.disabled = true;
        list.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-zinc-500 gap-6 anim-float-slow">
            <div class="w-32 h-32 rounded-[2.5rem] bg-white/5 border border-white/5 flex items-center justify-center shadow-inner">
              <i data-lucide="shopping-cart" class="w-16 h-16 opacity-40 text-zinc-400"></i>
            </div>
            <p class="text-xl font-bold tracking-widest uppercase text-center leading-relaxed">Carrinho Vazio <br/><span class="text-sm font-medium">Bipe ou selecione os produtos.</span></p>
          </div>
        `;
      }
      lucide.createIcons({ root: titleEl });
      lucide.createIcons({ root: list });
    }

                    </div>
                </div>

                <div class="border-t border-white/10 pt-8">

    function registerSangria() {
        const val = parseFloat(document.getElementById('sangria-val').value);
        if(isNaN(val) || val <= 0) return addToast('Valor inválido para sangria.', 'error');
        
        const saldoCaixa = getSaldoCaixaDinheiro();
        if (val > saldoCaixa) {
            return addToast(`Sangria negada. Valor físico no caixa é de R$ ${saldoCaixa.toFixed(2)}.`, 'error');
        }

        promptPassword(() => {
            transactions.unshift({
                id: Date.now(),
                tipo: 'DESPESA',
                descricao: `Sangria de Caixa (${pdvOperator})`,
                metodo: 'Dinheiro', 
                valor: -val,
                data: new Date().toLocaleDateString('pt-BR')
            });
            setStore('gymkhana_transactions', transactions);
            addToast(`Sangria de R$ ${val.toFixed(2)} autorizada.`, 'success');
            openCashRegister(); 
        }, ['Proprietário', 'Gerente']);
    }

    function closeCashRegister() {
        if(!window.confirm('Tem certeza que deseja fechar o caixa e encerrar seu turno?')) return;
        
        promptPassword(() => {
            transactions.unshift({
                id: Date.now(),
                tipo: 'DESPESA', 
                descricao: `Fechamento de Turno (${pdvOperator})`,
                metodo: 'Sistema',
                valor: 0,
                data: new Date().toLocaleDateString('pt-BR')
            });
            setStore('gymkhana_transactions', transactions);
            addToast('Imprimindo relatório de Fechamento (Z)...', 'info');
            setTimeout(() => {
                closeModal();
                lockPDV();
                addToast('Turno encerrado. Caixa bloqueado.', 'success');
            }, 2000);
        }, ['Proprietário', 'Gerente']);
    }

            <div class="bg-white/5 border border-white/10 p-6 rounded-[2rem] flex flex-wrap md:flex-nowrap justify-between items-center gap-6 ${isCanceled ? 'opacity-50 grayscale' : 'hover:bg-white/10 hover-lift'} transition-all anim-slide-up shadow-lg" style="animation-delay: ${i*0.05}s">
                <div class="flex items-center gap-6">
                   <div class="w-16 h-16 rounded-2xl bg-black/40 flex items-center justify-center shadow-inner border border-white/5 ${isCanceled ? 'text-zinc-500' : 'text-zinc-100'}">

                   </div>

                    <p class="text-3xl font-black text-rose-400 drop-shadow-md mb-1">R$ ${o.total.toFixed(2)}</p>
                    <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-1 rounded shadow-inner ${isCanceled ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}">
                        NFC-e ${isCanceled ? 'Cancelada' : 'Emitida'}
                    </span>
                </div>

                <div class="flex flex-col gap-3 min-w-[140px]">
                    ${isRecent && !isCanceled ? `<button onclick="reprintReceipt(${o.id})" class="px-5 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-bold rounded-xl transition-all flex justify-center items-center gap-2 hover-bounce border border-zinc-700"><i data-lucide="printer" class="w-4 h-4"></i> Reimprimir</button>` : ''}
                    ${!isRecent && !isCanceled ? `<div class="text-[10px] text-center text-zinc-500 font-bold uppercase tracking-widest px-2">Tempo excedido p/ reimpressão</div>` : ''}
                    
                    ${!isCanceled ? `<button onclick="requestCancelSale(${o.id})" class="px-5 py-3 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-sm font-bold rounded-xl transition-all flex justify-center items-center gap-2 hover-bounce border border-rose-500/30"><i data-lucide="x-circle" class="w-4 h-4"></i> Cancelar</button>` : ''}

            <div class="p-10 flex justify-between items-center border-b border-white/5 shrink-0 bg-black/20">
              <div>
                  <h3 class="text-3xl font-bold text-zinc-100 tracking-tight mb-1">Painel Fiscal & Histórico</h3>
                  <p class="text-zinc-400 font-medium">Gestão de NFC-e, Reimpressões (até 10 min) e Cancelamentos</p>
              </div>
            </div>
            <div class="flex-1 overflow-y-auto p-10 space-y-6 custom-scrollbar">
                ${htmlRows}
            </div>
          </div>
        `;
    }

    function reprintReceipt(id) {
        const order = orders.find(o => o.id === id);
        if(order) showReceiptModal(order, true);
    }

    function requestCancelSale(id) {
        promptPassword(() => {
            const order = orders.find(o => o.id === id);
            if(!order) return;

            order.status = 'Cancelada';
            setStore('gymkhana_orders', orders);

            order.items.forEach(item => {
                const prod = inventory.find(p => p.id === item.id);
                if(prod) prod.estoque += item.quantidade;
            });
            setStore('gymkhana_inventory', inventory);

            // Estorno de transação precisa lidar com múltiplos pagamentos se houver
            if (order.pagamentosDetalhados && order.pagamentosDetalhados.length > 0) {
                 order.pagamentosDetalhados.forEach(p => {
                    transactions.unshift({
                        id: Date.now() + Math.random(),
                        tipo: 'DESPESA',
                        descricao: `Estorno de Venda NFC-e #${id} (${p.metodo})`,
                        metodo: p.metodo,
                        valor: -p.aplicado,
                        data: new Date().toLocaleDateString('pt-BR')
                    });
                 });
            } else {
                 transactions.unshift({
                    id: Date.now(),
                    tipo: 'DESPESA',
                    descricao: `Estorno de Venda NFC-e #${id} (${order.pagamento})`,
                    metodo: order.pagamento,
                    valor: -order.total,
                    data: new Date().toLocaleDateString('pt-BR')
                });
            }
            setStore('gymkhana_transactions', transactions);

            addToast(`Pedido e NFC-e #${id} cancelados com sucesso.`, 'success');
            if(currentView === 'fiscal') renderFiscal(document.getElementById('main-content'));
        }, ['Proprietário'], "Cancelamento de NFC-e");
    }

    // --- KDS ---
    function renderKDS(container) {
      const activeOrders = orders.filter(o => o.status !== 'Entregue');

      const pre = activeOrders.filter(o=>o.status==='Em Preparo');
      const pro = activeOrders.filter(o=>o.status==='Pronto');

      const colHTML = activeOrders.map((order, i) => {
        const isPen = order.status === 'Pendente';
        const isPre = order.status === 'Em Preparo';
        const isCanc = order.status === 'Cancelada';
        if(isCanc) return ''; 
        
        const cardClass = isPen ? 'border-white/10' : isPre ? 'border-amber-500/50 shadow-[0_0_30px_rgba(245,158,11,0.1)]' : 'border-emerald-500/50 shadow-[0_0_30px_rgba(16,185,129,0.1)]';
        const hdrClass = isPen ? 'border-white/5 bg-black/20' : isPre ? 'border-amber-500/20 bg-amber-500/10' : 'border-emerald-500/20 bg-emerald-500/10';
        
        const itemsHTML = order.items.map(item => `
          <li class="flex items-start gap-4 text-lg font-medium text-zinc-200">
            <span class="bg-white/10 border border-white/10 text-zinc-100 px-3 py-1 rounded-xl text-base shrink-0 font-bold shadow-inner">${item.quantidade}x</span>
            <span class="pt-0.5 leading-snug">${item.nome}</span>
          </li>
        `).join('');

    function changeOrderStatus(id, newStatus) {
      const ord = orders.find(o => o.id === id);

      if(currentView === 'kds') renderKDS(document.getElementById('main-content'));
      lucide.createIcons();
    }

    // --- CATÁLOGO (ESTOQUE) ---

                     `<span class="text-rose-400 text-[11px] font-bold uppercase tracking-wider bg-rose-500/10 border border-rose-500/20 px-3 py-1.5 rounded-lg shadow-inner">Baixo</span>`;
        return `
          <tr class="hover:bg-white/5 transition-colors anim-slide-up" style="animation-delay: ${i * 0.05}s">
            <td class="px-10 py-6 font-mono text-zinc-500 text-sm">#${item.id.toString().substring(0, 5)}</td>
            <td class="px-10 py-6 font-semibold text-base">${item.nome}</td>
            <td class="px-10 py-6"><span class="bg-white/5 border border-white/5 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-bold">${item.categoria}</span></td>

                </button>
                <button onclick="openModalEstoque()" class="px-6 py-3.5 bg-rose-600 text-white rounded-xl font-bold text-sm flex items-center gap-3 hover:bg-rose-500 transition-colors shadow-[0_5px_20px_rgba(225,29,72,0.4)] active:scale-95 hover-bounce">

          <div class="flex-1 overflow-auto custom-scrollbar">

                <tr class="bg-black/40 text-zinc-400 font-semibold border-b border-white/5">

                  <th class="px-10 py-6 font-medium uppercase tracking-wider text-xs">Produto</th>

    function openModalEstoque() {

    function openModalEntradaNota() {
        const prodOptions = inventory.map(p => `<option value="${p.id}" class="bg-[#050505]">${p.nome} (Atual: ${p.estoque})</option>`).join('');
        const html = `
        <form id="form-entrada-nf" class="space-y-6">
          <div>
            <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Produto</label>
            <select required id="ent-prod" class="w-full px-5 py-4 bg-white/5 rounded-xl border border-white/10 focus:border-rose-500/50 outline-none text-base text-zinc-100 font-bold appearance-none">
                <option value="" class="bg-[#050505]">Selecione o produto...</option>
                ${prodOptions}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Qtd Entrada</label>
              <input required type="number" id="ent-qtd" class="w-full px-5 py-4 bg-white/5 rounded-xl border border-white/10 focus:border-rose-500/50 outline-none text-lg text-zinc-100 font-bold"/>
            </div>
            <div>
              <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Novo Custo Unit. (R$)</label>
              <input required type="number" step="0.01" id="ent-custo" class="w-full px-5 py-4 bg-white/5 rounded-xl border border-white/10 focus:border-rose-500/50 outline-none text-lg text-zinc-300 font-bold"/>
            </div>
          </div>
          <button type="submit" class="w-full py-5 mt-8 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-[0_10px_30px_rgba(16,185,129,0.4)] active:scale-95 uppercase tracking-wider hover-bounce flex justify-center items-center gap-2"><i data-lucide="check"></i> Confirmar Entrada</button>
        </form>
        `;
        openModal("Entrada de NF-e (Suprimento de Estoque)", html);
        
        document.getElementById('form-entrada-nf').addEventListener('submit', (e) => {
            e.preventDefault();
            const pId = parseInt(document.getElementById('ent-prod').value);
            const qtd = parseInt(document.getElementById('ent-qtd').value);
            const custo = parseFloat(document.getElementById('ent-custo').value);
            
            const prod = inventory.find(p => p.id === pId);
            if(prod) {
                prod.estoque += qtd;
                prod.custo = custo; // Atualiza o custo médio/atual
                setStore('gymkhana_inventory', inventory);
                addToast(`Entrada confirmada. Novo estoque de ${prod.nome}: ${prod.estoque} un.`, 'success');
                closeModal();
                if(currentView === 'estoque') renderEstoque(document.getElementById('main-content'));
            }
        });
    }

          const rows = transactions.length === 0 ? `<tr><td colSpan="5" class="p-10 text-center text-zinc-500 font-medium text-base">Sem movimentações financeiras.</td></tr>` :

                <button onclick="switchFinTab('pagar')" class="px-6 py-3 rounded-full font-bold transition-colors ${currentFinTab === 'pagar' ? 'bg-rose-600 text-white shadow-lg' : 'text-zinc-400 hover:text-white'}">Contas a Pagar</button>
                <button onclick="switchFinTab('receber')" class="px-6 py-3 rounded-full font-bold transition-colors ${currentFinTab === 'receber' ? 'bg-rose-600 text-white shadow-lg' : 'text-zinc-400 hover:text-white'}">Contas a Receber</button>

        currentFinTab = tab;
        if (currentView === 'financeiro') renderFinanceiro(document.getElementById('main-content'));

        const html = `

          <div>
             <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Descrição / Histórico</label>

          <div class="grid grid-cols-2 gap-6">

                <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Valor (R$)</label>
                <input required type="number" step="0.01" id="tit-val" class="w-full px-5 py-4 bg-white/5 rounded-xl border border-white/10 focus:border-rose-500/50 outline-none text-2xl text-zinc-100 font-black"/>
             </div>
             <div>
                <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase tracking-wider">Vencimento</label>
                <input required type="date" id="tit-venc" class="w-full px-5 py-4 bg-white/5 rounded-xl border border-white/10 focus:border-rose-500/50 outline-none text-base text-zinc-100 font-bold"/>
             </div>
          </div>
          <button type="submit" class="w-full py-5 mt-8 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition-all shadow-lg hover-bounce uppercase tracking-wider">Salvar Título</button>
        </form>
        `;
        openModal(isPayable ? "Nova Conta a Pagar" : "Nova Conta a Receber", html);
        
        document.getElementById('form-titulo').addEventListener('submit', (e) => {
            e.preventDefault();
            const obj = { id: Date.now(), descricao: document.getElementById('tit-desc').value, valor: parseFloat(document.getElementById('tit-val').value), vencimento: document.getElementById('tit-venc').value.split('-').reverse().join('/'), status: 'Aberto' };
            if (isPayable) { accountsPayable.push(obj); setStore('gymkhana_payable', accountsPayable); } 
            else { accountsReceivable.push(obj); setStore('gymkhana_receivable', accountsReceivable); }
            addToast('Título registrado com sucesso.', 'success'); closeModal();
            if(currentView === 'financeiro') renderFinanceiro(document.getElementById('main-content'));
        });
    }

    function baixarTitulo(id, tipo) {
        promptPassword(() => {
            let item;
            if (tipo === 'P') {
                item = accountsPayable.find(a => a.id === id);
                if(item) { item.status = 'Pago'; setStore('gymkhana_payable', accountsPayable); }
            } else {
                item = accountsReceivable.find(a => a.id === id);
                if(item) { item.status = 'Pago'; setStore('gymkhana_receivable', accountsReceivable); }
            }
            
            if(item) {
                transactions.unshift({
                    id: Date.now(), descricao: `Baixa: ${item.descricao}`,
                    tipo: tipo === 'P' ? 'DESPESA' : 'RECEITA',
                    metodo: 'Bancário', valor: tipo === 'P' ? -item.valor : item.valor,
                    data: new Date().toLocaleDateString('pt-BR')
                });
                setStore('gymkhana_transactions', transactions);
                addToast('Título liquidado e lançado no Razão.', 'success');
                if(currentView === 'financeiro') renderFinanceiro(document.getElementById('main-content'));
            }
        }, ['Proprietário', 'Gerente']);
    }

              <div class="flex-1">

                <select required id="fin-metodo" class="w-full px-5 py-4 bg-black/40 rounded-xl border border-white/10 focus:border-rose-500/50 focus:bg-black/60 outline-none text-base text-zinc-100 transition-colors shadow-inner font-bold appearance-none">

        btnDes.className = "flex-1 py-4 rounded-xl font-bold text-base transition-all border shadow-inner bg-black/40 border-white/10 text-zinc-500 hover:bg-white/10";
      };
      btnDes.onclick = () => {

        btnRec.className = "flex-1 py-4 rounded-xl font-bold text-base transition-all border shadow-inner bg-black/40 border-white/10 text-zinc-500 hover:bg-white/10";

        container.innerHTML = `
          <div class="flex gap-4 overflow-x-auto p-4 md:p-8 border-b border-white/5 hide-scrollbar bg-black/20 backdrop-blur-xl">${catTabs}</div>
          <div class="flex-1 p-6 md:p-10 overflow-y-auto custom-scrollbar">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-10 pb-48 md:pb-40">${prods}</div>
          </div>
          ${totemFooterHTML()}
        `;
      } 
      else if(totemStep === 'cart') {
        const cartList = cartTotem.map((item, i) => `
          <div class="flex flex-col md:flex-row justify-between items-center p-6 md:p-10 bg-white/5 backdrop-blur-2xl rounded-3xl md:rounded-[3rem] border border-white/10 shadow-2xl anim-slide-up hover-lift gap-6 md:gap-0" style="animation-delay: ${i*0.05}s">
            <div class="flex flex-col sm:flex-row items-center gap-4 md:gap-8 w-full md:w-auto text-center sm:text-left">
               <div class="w-16 h-16 md:w-24 md:h-24 bg-black/40 rounded-2xl flex items-center justify-center border border-white/5 shadow-inner shrink-0">
                  <i data-lucide="flame" class="w-8 h-8 md:w-10 md:h-10 text-rose-400"></i>
               </div>
               <div>
                  <h4 class="text-xl md:text-3xl font-bold text-zinc-100 mb-1 md:mb-2">${item.nome}</h4>
                  <p class="text-sm md:text-xl font-semibold text-zinc-500">R$ ${item.preco.toFixed(2)} un.</p>
               </div>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-4 md:gap-12 shrink-0 w-full md:w-auto justify-between sm:justify-end">
              <div class="flex items-center gap-4 md:gap-6 bg-black/60 rounded-[2rem] p-2 border border-white/5 shadow-inner">
                <button onclick="changeTotemQty(${item.id}, -1)" class="w-12 h-12 md:w-16 md:h-16 rounded-xl bg-white/5 flex items-center justify-center text-zinc-300 hover:text-white hover:bg-white/10 transition-colors hover-bounce"><i data-lucide="minus"></i></button>
                <span class="text-2xl md:text-4xl font-bold w-8 md:w-12 text-center text-zinc-100">${item.quantidade}</span>
                <button onclick="changeTotemQty(${item.id}, 1)" class="w-12 h-12 md:w-16 md:h-16 rounded-xl bg-white/5 flex items-center justify-center text-zinc-300 hover:text-white hover:bg-white/10 transition-colors hover-bounce"><i data-lucide="plus"></i></button>
              </div>
              <span class="text-3xl md:text-5xl font-black text-rose-400 md:w-56 text-center sm:text-right drop-shadow-[0_0_15px_rgba(225,29,72,0.3)]">R$ ${(item.quantidade * item.preco).toFixed(2)}</span>
            </div>
          </div>
        `).join('');

        // Seção de Cupom
        const couponSection = `
          <div class="mt-6 md:mt-10 p-6 md:p-8 bg-white/5 rounded-3xl md:rounded-[2rem] border border-white/10 shadow-lg flex flex-col md:flex-row items-center gap-6 anim-slide-up text-center md:text-left" style="animation-delay: 0.5s">
             <i data-lucide="tag" class="w-8 h-8 text-rose-400 hidden md:block"></i>
             <div class="flex-1 w-full">
                <p class="text-lg font-bold text-zinc-200 mb-1">Cupom de Desconto</p>
                <p class="text-sm text-zinc-500">Tem um cupom? Digite-o abaixo.</p>
             </div>
             <div class="flex flex-col sm:flex-row gap-3 w-full md:w-[400px]">
                <input type="text" id="totem-cupom-input" placeholder="Ex: GYM10" value="${totemDiscountCode}" class="w-full px-5 py-4 bg-black/40 rounded-xl border border-white/10 focus:border-rose-500/50 focus:bg-black/60 outline-none text-xl text-zinc-100 transition-colors shadow-inner font-bold uppercase text-center sm:text-left"/>
                <button onclick="applyTotemCoupon()" class="w-full sm:w-auto px-8 py-4 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 text-lg hover-bounce whitespace-nowrap">Aplicar</button>
             </div>
          </div>
        `;

        container.innerHTML = `
          <div class="flex-1 py-8 md:py-12 flex flex-col max-w-5xl mx-auto w-full px-4 md:px-0">
            <h2 class="text-3xl md:text-5xl font-bold text-zinc-100 mb-6 md:mb-10 px-2 md:px-4 tracking-tight anim-slide-up text-center md:text-left">Revise seu pedido</h2>
            <div class="flex-1 overflow-y-auto space-y-6 md:pr-4 custom-scrollbar pb-48 md:pb-40">
              ${cartList}
              ${couponSection}
            </div>
          </div>
          ${totemFooterHTML()}
        `;
      }
      else if(totemStep === 'payment') {
        const subtotal = cartTotem.reduce((acc, curr) => acc + (curr.preco * curr.quantidade), 0);
        const discountAmount = subtotal * totemDiscountValue;
        const total = subtotal - discountAmount;
        
        let discountDisplay = '';
        if(totemDiscountValue > 0) {
           discountDisplay = `
             <div class="text-rose-400 text-sm md:text-xl font-bold mb-4 bg-rose-500/10 inline-block px-4 py-2 rounded-full border border-rose-500/20">
               Desconto Aplicado: - R$ ${discountAmount.toFixed(2)} (${totemDiscountCode})
             </div>
           `;
        }

        container.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center pb-20 relative p-4">
            <div class="bg-black/60 backdrop-blur-3xl p-8 md:p-20 rounded-3xl md:rounded-[4rem] border border-white/10 max-w-4xl w-full text-center shadow-[0_30px_80px_rgba(0,0,0,0.8)] relative overflow-hidden anim-scale-in">
              <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-rose-600 to-rose-400 shadow-[0_0_30px_rgba(225,29,72,0.8)]"></div>
              <h2 class="text-3xl md:text-5xl font-bold text-zinc-100 mb-4 md:mb-6 mt-2 tracking-tight">Pagamento</h2>
              <p class="text-zinc-400 text-lg md:text-2xl mb-8 md:mb-10">Selecione a forma na máquina.</p>
              
              ${discountDisplay}

              <div class="text-5xl md:text-7xl font-black text-rose-400 mb-10 md:mb-16 bg-white/5 py-8 md:py-10 rounded-3xl md:rounded-[3rem] border border-white/10 shadow-inner drop-shadow-[0_0_20px_rgba(225,29,72,0.2)] anim-glow-pulse">
                R$ ${total.toFixed(2)}
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                <button onclick="processTotemPayment('Cartão de Crédito')" class="w-full py-6 md:py-8 bg-white/5 text-zinc-100 rounded-2xl md:rounded-3xl text-xl md:text-2xl font-semibold flex flex-col items-center justify-center gap-2 md:gap-4 hover:bg-white/10 transition-all border border-white/10 backdrop-blur-md hover:border-rose-500/50 hover:shadow-[0_0_30px_rgba(225,29,72,0.2)] hover-bounce">
                  <i data-lucide="credit-card" class="w-8 h-8 md:w-12 md:h-12 text-rose-400"></i> Crédito
                </button>
                <button onclick="processTotemPayment('Cartão de Débito')" class="w-full py-6 md:py-8 bg-white/5 text-zinc-100 rounded-2xl md:rounded-3xl text-xl md:text-2xl font-semibold flex flex-col items-center justify-center gap-2 md:gap-4 hover:bg-white/10 transition-all border border-white/10 backdrop-blur-md hover:border-rose-500/50 hover:shadow-[0_0_30px_rgba(225,29,72,0.2)] hover-bounce">
                  <i data-lucide="credit-card" class="w-8 h-8 md:w-12 md:h-12 text-rose-400"></i> Débito
                </button>
                <button onclick="processTotemPayment('Vale Refeição')" class="w-full py-6 md:py-8 bg-white/5 text-zinc-100 rounded-2xl md:rounded-3xl text-xl md:text-2xl font-semibold flex flex-col items-center justify-center gap-2 md:gap-4 hover:bg-white/10 transition-all border border-white/10 backdrop-blur-md hover:border-rose-500/50 hover:shadow-[0_0_30px_rgba(225,29,72,0.2)] hover-bounce">
                  <i data-lucide="utensils" class="w-8 h-8 md:w-12 md:h-12 text-rose-400"></i> Vale Refeição
                </button>
                <button onclick="processTotemPayment('Pix')" class="w-full py-6 md:py-8 bg-white/5 text-zinc-100 rounded-2xl md:rounded-3xl text-xl md:text-2xl font-semibold flex flex-col items-center justify-center gap-2 md:gap-4 hover:bg-white/10 transition-all border border-white/10 backdrop-blur-md hover:border-emerald-500/50 hover:shadow-[0_0_30px_rgba(16,185,129,0.2)] hover-bounce">
                  <i data-lucide="smartphone" class="w-8 h-8 md:w-12 md:h-12 text-emerald-400"></i> Pix
                </button>
              </div>
              <button onclick="totemSetStep('cart')" class="mt-8 md:mt-12 text-lg md:text-xl text-zinc-500 font-semibold hover:text-white transition-colors px-8 py-3 rounded-full hover:bg-white/5">Voltar</button>
            </div>
          </div>
        `;
      }
      else if(totemStep === 'processing') {
        let content = '';
        if(totemPaymentMethod === 'Pix') {
            content = `
                <div class="bg-white/10 p-6 md:p-8 rounded-3xl mb-8 border border-white/20 shadow-inner inline-block relative">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=GymkhanaFastfoodPixSimulado" alt="QR Code Pix" class="w-40 h-40 md:w-56 md:h-56 rounded-xl shadow-lg mix-blend-screen">
                    <div class="absolute inset-0 bg-emerald-500/10 rounded-3xl pointer-events-none anim-glow-pulse"></div>
                </div>
                <h3 class="text-3xl md:text-5xl font-bold text-zinc-100 mb-6 tracking-tight">Escaneie o QR Code</h3>
                <p class="text-zinc-400 text-lg md:text-2xl flex flex-col sm:flex-row items-center justify-center gap-4 font-semibold">
                    <i data-lucide="loader-2" class="animate-spin text-emerald-400 w-8 h-8"></i> Aguardando pagamento via Pix...
                </p>
            `;
        } else {
            content = `
                <div class="w-32 h-32 md:w-48 md:h-48 bg-rose-500/10 border border-rose-500/30 rounded-full flex items-center justify-center mb-10 mx-auto shadow-[0_0_60px_rgba(225,29,72,0.3)] anim-glow-pulse">
                    <i data-lucide="credit-card" class="w-16 h-16 md:w-24 md:h-24 text-rose-400"></i>
                </div>
                <h3 class="text-3xl md:text-5xl font-bold text-zinc-100 mb-6 tracking-tight">Siga as instruções na máquina</h3>
                <p class="text-zinc-400 text-lg md:text-2xl flex flex-col sm:flex-row items-center justify-center gap-4 font-semibold">
                    <i data-lucide="loader-2" class="animate-spin text-rose-500 w-8 h-8"></i> Processando pagamento...
                </p>
            `;
        }
        
        container.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center anim-scale-in relative p-4">
             <div class="bg-black/60 backdrop-blur-3xl p-10 md:p-20 rounded-3xl md:rounded-[4rem] border border-white/10 max-w-4xl w-full text-center shadow-[0_30px_80px_rgba(0,0,0,0.8)] relative overflow-hidden">
                 <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-rose-600 to-rose-400 shadow-[0_0_30px_rgba(225,29,72,0.8)]"></div>
                 ${content}
                 <button onclick="cancelTotemPayment()" class="mt-10 md:mt-16 text-lg md:text-xl text-red-400 font-semibold hover:text-red-300 transition-colors px-6 py-3 md:px-10 md:py-4 rounded-full hover:bg-red-500/10 border border-transparent hover:border-red-500/20">Cancelar Operação</button>
             </div>
          </div>
        `;
        
        if(totemProcessingTimer) clearTimeout(totemProcessingTimer);
        totemProcessingTimer = setTimeout(() => {
            finalizeTotemSale();
        }, 5000);
      }
      else if(totemStep === 'success') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center anim-scale-in p-4">
            <div class="w-32 h-32 md:w-48 md:h-48 bg-emerald-500/10 border border-emerald-500/30 rounded-full md:rounded-[3rem] flex items-center justify-center mb-8 md:mb-12 shadow-[0_0_80px_rgba(16,185,129,0.3)] anim-glow-pulse">
              <i data-lucide="check" class="w-16 h-16 md:w-20 md:h-20 text-emerald-400"></i>
            </div>
            <h2 class="text-4xl md:text-6xl font-bold text-zinc-100 mb-4 md:mb-6 tracking-tight">Pagamento Aprovado</h2>
            <p class="text-lg md:text-2xl text-zinc-400 mb-8 md:mb-12 font-medium px-4">Aguarde o chamado no painel. O seu pedido já está na cozinha.</p>
            <div class="bg-white/5 backdrop-blur-3xl border border-white/10 py-8 px-12 md:py-12 md:px-24 rounded-3xl md:rounded-[4rem] flex flex-col items-center shadow-2xl hover-lift mb-8 md:mb-12 w-full max-w-lg">
              <span class="text-sm md:text-xl font-bold text-zinc-500 mb-2 md:mb-4 uppercase tracking-widest">Senha do Pedido</span>
              <span class="text-6xl md:text-8xl font-black text-rose-400 drop-shadow-[0_0_30px_rgba(225,29,72,0.5)]">
                #${lastTotemOrder ? lastTotemOrder.id : '000'}
              </span>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 md:gap-6 w-full max-w-lg justify-center">
                <button onclick="simulateTotemPrint()" class="w-full sm:w-auto px-6 py-4 md:px-10 md:py-6 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-2xl transition-all shadow-[0_10px_30px_rgba(0,0,0,0.5)] active:scale-95 text-lg md:text-xl flex items-center justify-center gap-3 hover-bounce">
                    <i data-lucide="printer"></i> Imprimir Nota Fiscal
                </button>
                <button onclick="resetTotem()" class="w-full sm:w-auto px-6 py-4 md:px-10 md:py-6 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-2xl transition-all shadow-[0_10px_30px_rgba(225,29,72,0.4)] active:scale-95 text-lg md:text-xl flex items-center justify-center gap-3 hover-bounce">
                    Nova Compra <i data-lucide="arrow-right"></i>
                </button>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function totemFooterHTML() {
      const subtotal = cartTotem.reduce((acc, curr) => acc + (curr.preco * curr.quantidade), 0);
      const discountAmount = subtotal * totemDiscountValue;
      const total = subtotal - discountAmount;
      
      let btns = '';
      if(totemStep === 'menu') {
        btns = `<button onclick="totemSetStep('cart')" ${cartTotem.length === 0 ? 'disabled' : ''} class="w-full md:w-auto px-6 py-4 md:px-14 md:py-6 bg-rose-600 disabled:opacity-50 text-white rounded-2xl md:rounded-[2rem] font-bold text-lg md:text-2xl flex items-center justify-center gap-4 transition-all hover:bg-rose-500 shadow-[0_10px_30px_rgba(225,29,72,0.4)] active:scale-95 uppercase tracking-wider hover-bounce">Revisar Pedido <i data-lucide="arrow-right"></i></button>`;
      } else if(totemStep === 'cart') {
        btns = `
          <button onclick="totemSetStep('payment')" class="flex-1 md:flex-none px-4 py-4 md:px-16 md:py-6 bg-rose-600 text-white rounded-2xl md:rounded-[2rem] font-bold text-sm md:text-2xl flex items-center justify-center gap-2 md:gap-4 transition-colors hover:bg-rose-500 shadow-[0_10px_30px_rgba(225,29,72,0.4)] active:scale-95 uppercase tracking-wider hover-bounce"><i data-lucide="arrow-left" class="md:hidden"></i> Pagar <i data-lucide="arrow-right" class="hidden md:block"></i></button>
          <button onclick="totemSetStep('menu')" class="flex-1 md:flex-none px-4 py-4 md:px-10 md:py-6 bg-white/5 text-zinc-300 rounded-2xl md:rounded-[2rem] font-bold text-sm md:text-xl transition-colors hover:bg-white/10 border border-white/10 uppercase tracking-wider hover-bounce text-center">Adicionar mais</button>
        `;
      }
      
      return `
        <div class="fixed bottom-4 md:bottom-10 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] md:w-[calc(100%-4rem)] max-w-6xl bg-black/95 backdrop-blur-3xl border border-white/10 p-4 md:p-6 rounded-[2rem] md:rounded-[3rem] flex flex-col md:flex-row justify-between items-center shadow-[0_40px_80px_rgba(0,0,0,0.9)] z-20 anim-slide-up gap-4 md:gap-0" style="animation-delay: 0.4s">
          
          <div class="flex flex-row items-center gap-3 md:gap-4 md:pl-2 w-full md:w-auto order-2 md:order-1">
            ${btns}
          </div>

          <div class="flex items-center gap-4 md:gap-8 md:pr-8 w-full md:w-auto justify-between md:justify-end px-2 md:px-0 order-1 md:order-2 border-b border-white/10 md:border-b-0 pb-4 md:pb-0 mb-2 md:mb-0">
            <div class="text-left md:text-right w-full">
               <div class="text-zinc-500 font-bold text-xs md:text-sm uppercase tracking-widest mb-1 md:mb-2">Total a Pagar</div>
               <div class="text-3xl md:text-5xl font-black text-zinc-100 drop-shadow-md">R$ ${total.toFixed(2)}</div>
            </div>
          </div>
          
        </div>
      `;
    }

    function totemSetActiveCat(cat) {
      totemActiveCat = cat;
      renderTotem();
    }

    function totemSetStep(step) {
      totemStep = step;
      renderTotem();
    }

    function addToTotemCart(id) {
      const prod = inventory.find(i => i.id === id);
      if(!prod || prod.estoque <= 0) return;
      const exist = cartTotem.find(i => i.id === id);
      if(exist) {
        if(exist.quantidade >= prod.estoque) return;
        exist.quantidade++;
      } else {
        cartTotem.push({...prod, quantidade: 1});
      }
      renderTotem();
    }

    function changeTotemQty(id, delta) {
       const item = cartTotem.find(i => i.id === id);
       if(!item) return;
       item.quantidade += delta;
       if(item.quantidade <= 0) cartTotem = cartTotem.filter(i => i.id !== id);
       // Resetar o desconto se o carrinho esvaziar
       if(cartTotem.length === 0) { totemDiscountValue = 0; totemDiscountCode = ''; }
       renderTotem();
    }

    function applyTotemCoupon() {
        const input = document.getElementById('totem-cupom-input').value.toUpperCase().trim();
        if(input === 'GYM10') {
            totemDiscountValue = 0.10;
            totemDiscountCode = input;
            addToast('Oba! Cupom GYM10 de 10% aplicado.', 'success');
        } else if (input === '') {
            totemDiscountValue = 0;
            totemDiscountCode = '';
            addToast('Cupom removido.', 'info');
        } else {
            addToast('Cupom inválido ou expirado.', 'error');
        }
        renderTotem();
    }

    function processTotemPayment(method) {
      totemPaymentMethod = method;
      totemStep = 'processing';
      renderTotem();
    }
    
    function cancelTotemPayment() {
      if(totemProcessingTimer) clearTimeout(totemProcessingTimer);
      totemPaymentMethod = '';
      totemStep = 'payment';
      addToast('Pagamento cancelado pelo usuário.', 'info');
      renderTotem();
    }

    function finalizeTotemSale() {
      const subtotal = cartTotem.reduce((acc, curr) => acc + (curr.preco * curr.quantidade), 0);
      const discountAmount = subtotal * totemDiscountValue;
      const total = subtotal - discountAmount;
      
      lastTotemOrder = processSale(cartTotem, total, 'Totem', totemPaymentMethod, discountAmount);
      totemStep = 'success';
      renderTotem();
      
      // Auto-reset longo caso o cliente abandone a tela de sucesso
      setTimeout(() => {
        if(totemStep === 'success') {
          resetTotem();
        }
      }, 15000);
    }
    
    function resetTotem() {
        cartTotem = [];
        totemStep = 'menu';
        totemDiscountValue = 0;
        totemDiscountCode = '';
        totemPaymentMethod = '';
        if(totemProcessingTimer) clearTimeout(totemProcessingTimer);
        renderTotem();
    }

    function simulateTotemPrint() {
        addToast('Imprimindo cupom fiscal e senha...', 'info');
        setTimeout(() => {
            resetTotem();
        }, 3000);
    }

    // Inicialização ao carregar a página
    window.onload = () => {
      initApp();
      lucide.createIcons();
    };
  </script>
</body>
</html>
